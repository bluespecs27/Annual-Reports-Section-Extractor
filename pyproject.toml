[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iimrr"
version = "0.1.0"
description = "Deterministic-first annual-report PDF section extractor"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.23", "rapidfuzz>=3.0"]

[project.scripts]
iimrr = "iimrr.cli:main"
iimrr-ui = "iimrr.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["iimrr*"]
